name: Python CI

on:
  # push:
  pull_request:

env:
  # ruff の指摘を PR 上にアノテーション表示する
  RUFF_OUTPUT_FORMAT: github

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: ".python-version"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # 検証ロジックは Makefile (make ci) に一元化している。
      # ローカル / Stop hook / CI がすべて同じコマンドを呼ぶ。
      - name: Run CI checks
        run: make ci
