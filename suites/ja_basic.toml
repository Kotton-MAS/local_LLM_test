# 日本語の基本タスク 8 問 × 3 モデルの比較スイート。
#
# ★ このファイルの内容と、これに対する応答は results/ にコミットされる。
#   機密情報・個人情報・実在する個人や組織の内部情報を一切書かないこと (D-24)。
#   プロンプトはすべて一般公開情報と架空の例文だけで構成する。
#
# max_output_tokens は 512 に抑える。応答本文が results/ に残るため、
# 長すぎるとリポジトリが読めなくなる (承認済み: 2026-08-23)。

[suite]
id = "ja_basic"
description = "日本語の基本タスク 8 問で生成速度・VRAM・再現条件を比較する"
warmup_runs = 1

[[models]]
model_id = "qwen3-14b"
profile = "rag_default"
max_output_tokens = 512

[[models]]
model_id = "gpt-oss-20b"
profile = "long_context"
max_output_tokens = 512

[[models]]
model_id = "qwen3-8b"
profile = "lightweight"
max_output_tokens = 512

# --------------------------------------------------------------------------
# 8 問。id は出力の突き合わせキーになるためスイート内で一意にする。
# --------------------------------------------------------------------------

[[prompts]]
id = "summarize"
tags = ["要約"]
system = "あなたは日本語の技術文書を扱うアシスタントです。"
text = """
次の文章を3行で要約してください。

大規模言語モデルをローカルの GPU で動かす場合、モデルの重み・KV キャッシュ・
推論ランタイムの作業領域の3つが VRAM を消費する。重みは量子化の方式で決まり、
KV キャッシュはコンテキスト長にほぼ比例して増える。したがって、同じモデルでも
コンテキスト長を伸ばすと搭載メモリに収まらなくなることがある。収まらない分は
CPU 側のメモリへ退避されるが、そのとき生成速度は大きく低下する。
"""

[[prompts]]
id = "paraphrase"
tags = ["言い換え"]
text = """
次の一文を、意味を変えずにより平易な日本語へ言い換えてください。
言い換えた文だけを出力してください。

「当該処理は、入力値の妥当性検証が完了した後に限り実行されるものとする。」
"""

[[prompts]]
id = "bulletize"
tags = ["整形"]
text = """
次の文章を、重複を除いた箇条書きに整形してください。各項目は40文字以内、
全体で5項目以内にしてください。

バックアップは毎日取得する。取得したバックアップは別の場所へ保管する。
復元手順は文書化しておく。復元手順は定期的に試す。バックアップは毎日取得し、
その結果を記録する。保管期間は用途に応じて決める。
"""

[[prompts]]
id = "explain_term"
tags = ["用語説明"]
text = """
「量子化 (quantization)」という用語を、機械学習の入門者向けに200字程度で
説明してください。数式は使わないでください。
"""

[[prompts]]
id = "translate_short"
tags = ["翻訳"]
text = """
次の日本語を英語に翻訳してください。訳文だけを出力してください。

「この設定ファイルを変更したら、必ずテストを実行してから反映してください。」
"""

[[prompts]]
id = "extract_structured"
tags = ["構造化抽出"]
system = "あなたは指定された形式を厳密に守るアシスタントです。"
text = """
次の文から、日時・場所・持ち物を抽出し、JSON オブジェクト1つだけを
出力してください。説明文は出力しないでください。
キーは datetime, place, items の3つとします。

「次回の勉強会は4月12日の午後2時から、市民会館の第3会議室で行います。
参加者はノートパソコンと電源アダプタを持参してください。」
"""

[[prompts]]
id = "follow_instructions"
tags = ["指示追従"]
text = """
以下の制約をすべて満たして回答してください。

1. 「バージョン管理を使う利点」を3つ挙げる
2. 各利点は必ず「・」で始める
3. 各利点は30文字以内にする
4. 3つ以外は何も出力しない
"""

[[prompts]]
id = "ambiguous_request"
tags = ["曖昧な依頼"]
text = """
「あれ、いい感じにしておいて。」

この依頼は情報が不足しています。作業に取りかかる前に確認すべきことを、
質問の形で3つ挙げてください。推測で作業を始めないでください。
"""
